# CI/CD — test every push; deploy main to AWS when the tests pass.
#
# GitHub reads any .yml file under .github/workflows/ and runs it on a
# fresh Ubuntu virtual machine it provisions and destroys per run. That
# clean slate is the point: "works on my machine" stops being possible,
# because the machine is new every time and has nothing of yours on it.
#
#   push / PR  ──▶  test  ──(main only, tests green)──▶  deploy

name: CI

# WHEN to run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # A SERVICE CONTAINER: GitHub starts Postgres alongside the job,
    # the same way docker-compose.yml does locally. Same image, same
    # credentials -- so the environment your tests run against in CI
    # matches the one on your laptop.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liftsync
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: liftsync
        ports:
          # 5432 here, not 5433. The port shift locally exists only to
          # avoid colliding with a native Postgres install; the runner
          # has nothing to collide with.
          - 5432:5432
        # The same race condition you hit locally: the container starts
        # before Postgres is ready to accept connections. GitHub will
        # not begin the steps until this health check passes.
        options: >-
          --health-cmd "pg_isready -U liftsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # There is no .env file in CI -- it is gitignored, correctly.
    # These take its place. Values are throwaway, matching a database
    # that exists for ninety seconds and is then destroyed.
    #
    # A real secret would go in GitHub's encrypted secrets and be
    # referenced as ${{ secrets.NAME }}, never written here.
    env:
      DATABASE_URL: postgresql+psycopg://liftsync:devpassword@localhost:5432/liftsync
      JWT_SECRET_KEY: ci-only-signing-key-not-a-secret
      ENVIRONMENT: development

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads between runs, keyed on requirements.txt.
          # Change a dependency and the cache invalidates itself.
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # This is why `pip freeze > requirements.txt` mattered. The runner
      # has none of your packages; that file is the only record of what
      # this project needs.

      - name: Run tests
        working-directory: backend
        run: pytest
        # conftest.py creates liftsync_test and runs migrations against
        # it, exactly as it does locally. So this step also verifies
        # that your migrations build a working schema from empty --
        # every push, on a machine that has never seen your database.

  # ====================================================================
  # DEPLOY
  #
  # No AWS keys and no SSH, anywhere.
  #
  #  1. OIDC: GitHub signs a short-lived token saying "this is a run of
  #     DilpreetMann25/LiftSync on refs/heads/main". AWS checks the
  #     signature and the claims against the trust policy on the
  #     liftsync-github-deploy role, then hands back credentials that
  #     expire within the hour. Nothing long-lived is stored in GitHub.
  #
  #  2. SSM: with those credentials, ask Systems Manager to run
  #     deploy.sh on the server. The SSM agent on the box polls AWS for
  #     work over outbound HTTPS, so no inbound port has to be open.
  #
  # deploy.sh is the exact script you have been running by hand.
  # ====================================================================
  deploy:
    needs: test   # never deploy code whose tests failed
    # Pushes to main only. Pull requests run the tests and stop here.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Two quick pushes would otherwise start two deploys at once, both
    # running migrations and restarting the service. This queues them.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    # id-token: write is what allows the job to request an OIDC token.
    # Without it, there is nothing to exchange for AWS credentials.
    permissions:
      id-token: write
      contents: read

    # Repository *variables*, not secrets: a role ARN and an instance ID
    # identify things but grant nothing on their own. The trust policy
    # is what decides who may use the role.
    env:
      AWS_REGION: us-east-1
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}

    steps:
      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run deploy.sh on the server (SSM)
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "LiftSync deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters "commands=[\"REF=${GITHUB_SHA} bash /opt/liftsync/app/deploy/deploy.sh\"]" \
            --query Command.CommandId --output text)
          echo "SSM command id: $COMMAND_ID"

          # Poll ourselves rather than using `aws ssm wait`: the built-in
          # waiter gives up after ~100 seconds, and a deploy that builds
          # the frontend takes longer than that on a small instance.
          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
                       --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            echo "  status: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done

          echo "----- deploy.sh output -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          [ "$STATUS" = "Success" ] || { echo "Deploy finished with status: $STATUS"; exit 1; }

      # deploy.sh already checked the API from inside the server. This
      # checks it the way a visitor would: DNS, TLS certificate, Nginx,
      # uvicorn, RDS -- the entire path, from outside AWS.
      - name: Smoke test the live site
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$PUBLIC_URL/api/v1/health"
          echo
          curl -fsS -o /dev/null -w "Frontend: HTTP %{http_code}\n" "$PUBLIC_URL/"
