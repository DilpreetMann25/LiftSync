# How LiftSync is served -- shared by the HTTP and HTTPS server blocks.
#
# Included into both rather than copied into each, so the two can never
# drift apart: change a route here and both protocols get it.
#
# Installed to /etc/nginx/snippets/liftsync-locations.conf by deploy.sh.

root /var/www/liftsync;
index index.html;

# Don't advertise the exact Nginx version to scanners.
server_tokens off;

# Small API payloads only; no file uploads in this app.
client_max_body_size 1m;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# ---- API -> uvicorn --------------------------------------------------
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The AI coach makes several model round-trips; the default 60s
    # timeout is too tight for the slow ones.
    proxy_read_timeout 120s;
}

# FastAPI's interactive docs, public on purpose for the portfolio.
location ~ ^/(docs|redoc|openapi\.json)$ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
}

# ---- Built frontend assets -------------------------------------------
# Vite puts a content hash in every asset filename, so the file at a
# given URL never changes and browsers can cache it for a year.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# ---- Everything else -> the React app --------------------------------
# /progress and /coach aren't files; they're routes inside React.
# Fall back to index.html and let react-router take over. Without this,
# refreshing any page except / returns a 404.
location / {
    try_files $uri $uri/ /index.html;
}
