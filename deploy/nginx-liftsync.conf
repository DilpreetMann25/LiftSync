# LiftSync over plain HTTP.
#
# Used until a TLS certificate exists -- on a brand-new server, or before
# certbot has run. deploy.sh switches to nginx-liftsync-https.conf.template
# automatically once the certificate is in place.
#
# Installed to /etc/nginx/sites-available/liftsync by deploy.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt proves you control the hostname by fetching a file
    # from here over plain HTTP. Kept outside the app's web root so a
    # deploy (which wipes /var/www/liftsync) can't delete it mid-check.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/liftsync-locations.conf;
}
