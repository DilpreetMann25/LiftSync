# Nginx site for LiftSync.
#
# Nginx is the only thing listening to the internet. It serves the built
# React app directly from disk -- fast, no Python involved -- and passes
# /api requests through to uvicorn on 127.0.0.1:8000.
#
# Frontend and API therefore share one origin, so the browser never
# makes a cross-origin request and CORS never comes into play. This is
# the production version of the Vite dev proxy.
#
# Installed to /etc/nginx/sites-available/liftsync by deploy.sh.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/liftsync;
    index index.html;

    # Don't advertise the exact Nginx version to scanners.
    server_tokens off;

    # Small API payloads only; no file uploads in this app.
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- API -> uvicorn ----------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI coach makes several model round-trips; the default
        # 60s timeout is too tight for the slow ones.
        proxy_read_timeout 120s;
    }

    # FastAPI's interactive docs, kept public on purpose for the portfolio.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ---- Built frontend assets ---------------------------------------
    # Vite puts a content hash in every asset filename, so a file at a
    # given URL never changes. Browsers can cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- Everything else -> the React app ----------------------------
    # /progress or /coach don't exist as files; they are routes inside
    # React. Fall back to index.html and let react-router take over.
    # Without this, refreshing any page except / would return a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
