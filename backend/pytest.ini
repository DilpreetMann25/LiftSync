[pytest]
testpaths = tests

# -q      quieter output
# -ra     summary of everything that was not a plain pass
# --strict-markers  typo in a marker name becomes an error, not silence
addopts = -q -ra --strict-markers

# Show the full assertion diff rather than truncating it. When a test
# fails you want to see both values, not "...".
python_files = test_*.py
python_functions = test_*
